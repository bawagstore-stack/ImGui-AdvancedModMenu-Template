name: iOS Mod Menu CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Xcode Project Successfully
      run: |
        PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
        echo "Found project: $PROJECT_FILE"
        xcodebuild -project "$PROJECT_FILE" -alltargets -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO INFOPLIST_FILE=""

    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BAWAGSTORE-ModMenu
        path: |
          build/Release-iphoneos/*.dylib
          **/Release-iphoneos/*.dylib
